services:
  pki-init:
    image: alpine:3.20
    entrypoint: ["sh", "/pki-init.sh"]
    volumes:
      - pki-server-data:/pki-server
      - pki-client1-data:/pki-client1
      - pki-client2-data:/pki-client2
      - ./pki-init.sh:/pki-init.sh:ro

  openvpn-server:
    build:
      context: .
      dockerfile: openvpn.Dockerfile
    image: openvpn-exporter-test-openvpn-26:local
    depends_on:
      pki-init:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: server
    volumes:
      - pki-server-data:/pki:ro

  # openvpn_26/openvpn_25 run genuinely different, real OpenVPN releases
  # (2.6.x and 2.5.x respectively, see openvpn.Dockerfile's ALPINE_VERSION
  # arg) so openvpn_tunnel_info's version parsing is exercised against more
  # than one real version, not just mocked fixtures.
  openvpn_26:
    build:
      context: .
      dockerfile: openvpn.Dockerfile
    image: openvpn-exporter-test-openvpn-26:local
    depends_on:
      - openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: client
      OPENVPN_REMOTE: openvpn-server
      OPENVPN_MANAGEMENT_PASSWORD: ${CLIENT1_MGMT_PASSWORD}
    volumes:
      - pki-client1-data:/pki:ro

  openvpn_25:
    build:
      context: .
      dockerfile: openvpn.Dockerfile
      args:
        ALPINE_VERSION: "3.16"
    image: openvpn-exporter-test-openvpn-25:local
    depends_on:
      - openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: client
      OPENVPN_REMOTE: openvpn-server
      OPENVPN_MANAGEMENT_PASSWORD: ${CLIENT2_MGMT_PASSWORD}
    volumes:
      - pki-client2-data:/pki:ro

  # Both exporters read ca+cert via config_path, mounting their client's
  # full PKI directory read-only: ca.crt/tls.crt are 644, tls.key is 600 and
  # root-owned, while the exporter itself runs as non-root (see the root
  # Dockerfile) -- a real, not simulated, demonstration that the private key
  # is never opened.
  exporter_26:
    build: ../..
    depends_on:
      - openvpn_26
    environment:
      OPENVPN_EXPORTER_TUNNEL_NAME: openvpn_26
      OPENVPN_EXPORTER_TUNNEL_MANAGEMENT_ADDRESS: openvpn_26:7504
      OPENVPN_EXPORTER_TUNNEL_CONFIG_PATH: /pki/client.conf
      OPENVPN_EXPORTER_PASSWORD: ${CLIENT1_MGMT_PASSWORD}
      OPENVPN_EXPORTER_SCRAPE_TIMEOUT: 3s
    volumes:
      - pki-client1-data:/pki:ro
    ports:
      - "127.0.0.1:9176:9176"

  exporter_25:
    build: ../..
    depends_on:
      - openvpn_25
    environment:
      OPENVPN_EXPORTER_TUNNEL_NAME: openvpn_25
      OPENVPN_EXPORTER_TUNNEL_MANAGEMENT_ADDRESS: openvpn_25:7504
      OPENVPN_EXPORTER_TUNNEL_CONFIG_PATH: /pki/client.conf
      OPENVPN_EXPORTER_PASSWORD: ${CLIENT2_MGMT_PASSWORD}
      OPENVPN_EXPORTER_SCRAPE_TIMEOUT: 3s
    volumes:
      - pki-client2-data:/pki:ro
    ports:
      - "127.0.0.1:9177:9176"

volumes:
  pki-server-data:
  pki-client1-data:
  pki-client2-data:
