services:
  pki-init:
    image: alpine:3.20
    entrypoint: ["sh", "/pki-init.sh"]
    volumes:
      - pki-server-data:/pki-server
      - pki-openvpn_26-data:/pki-openvpn_26
      - pki-openvpn_25-data:/pki-openvpn_25
      - pki-openvpn_27-data:/pki-openvpn_27
      - ./pki-init.sh:/pki-init.sh:ro

  openvpn-server:
    build:
      context: ..
      dockerfile: openvpn.Dockerfile
    image: openvpn-exporter-test-openvpn-26:local
    depends_on:
      pki-init:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: server
      OPENVPN_MANAGEMENT_PASSWORD: ${SERVER_MGMT_PASSWORD}
    volumes:
      - pki-server-data:/pki:ro

  # openvpn 2.5
  openvpn_25:
    build:
      context: ..
      dockerfile: openvpn.Dockerfile
      args:
        ALPINE_VERSION: "3.16"
    image: openvpn-exporter-test-openvpn-25:local
    depends_on:
      - openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: client
      OPENVPN_REMOTE: openvpn-server
      OPENVPN_MANAGEMENT_PASSWORD: ${OPENVPN_25_MGMT_PASSWORD}
    volumes:
      - pki-openvpn_25-data:/pki:ro

  exporter_25:
    build: ../../..
    depends_on:
      - openvpn_25
    environment:
      OPENVPN_EXPORTER_TUNNEL_NAME: openvpn_25
      OPENVPN_EXPORTER_TUNNEL_MANAGEMENT_ADDRESS: openvpn_25:7504
      OPENVPN_EXPORTER_TUNNEL_CONFIG_PATH: /pki/client.conf
      OPENVPN_EXPORTER_PASSWORD: ${OPENVPN_25_MGMT_PASSWORD}
      OPENVPN_EXPORTER_SCRAPE_TIMEOUT: 3s
    volumes:
      - pki-openvpn_25-data:/pki:ro
    ports:
      - "127.0.0.1:9177:9176"

  # openvpn 2.6
  openvpn_26:
    build:
      context: ..
      dockerfile: openvpn.Dockerfile
    image: openvpn-exporter-test-openvpn-26:local
    depends_on:
      - openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: client
      OPENVPN_REMOTE: openvpn-server
      OPENVPN_MANAGEMENT_PASSWORD: ${OPENVPN_26_MGMT_PASSWORD}
    volumes:
      - pki-openvpn_26-data:/pki:ro

  exporter_26:
    build: ../../..
    depends_on:
      - openvpn_26
    environment:
      OPENVPN_EXPORTER_TUNNEL_NAME: openvpn_26
      OPENVPN_EXPORTER_TUNNEL_MANAGEMENT_ADDRESS: openvpn_26:7504
      OPENVPN_EXPORTER_TUNNEL_CONFIG_PATH: /pki/client.conf
      OPENVPN_EXPORTER_PASSWORD: ${OPENVPN_26_MGMT_PASSWORD}
      OPENVPN_EXPORTER_SCRAPE_TIMEOUT: 3s
    volumes:
      - pki-openvpn_26-data:/pki:ro
    ports:
      - "127.0.0.1:9176:9176"

  # openvpn 2.7 -- alpine:edge is the only Alpine tag currently carrying
  # OpenVPN 2.7 (not yet in a stable numbered release) -- unlike the pinned
  # 3.16/3.20 tags above, its package contents can shift over time.
  openvpn_27:
    build:
      context: ..
      dockerfile: openvpn.Dockerfile
      args:
        ALPINE_VERSION: "edge"
    image: openvpn-exporter-test-openvpn-27:local
    depends_on:
      - openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      OPENVPN_ROLE: client
      OPENVPN_REMOTE: openvpn-server
      OPENVPN_MANAGEMENT_PASSWORD: ${OPENVPN_27_MGMT_PASSWORD}
    volumes:
      - pki-openvpn_27-data:/pki:ro

  exporter_27:
    build: ../../..
    depends_on:
      - openvpn_27
    environment:
      OPENVPN_EXPORTER_TUNNEL_NAME: openvpn_27
      OPENVPN_EXPORTER_TUNNEL_MANAGEMENT_ADDRESS: openvpn_27:7504
      OPENVPN_EXPORTER_TUNNEL_CONFIG_PATH: /pki/client.conf
      OPENVPN_EXPORTER_PASSWORD: ${OPENVPN_27_MGMT_PASSWORD}
      OPENVPN_EXPORTER_SCRAPE_TIMEOUT: 3s
    volumes:
      - pki-openvpn_27-data:/pki:ro
    ports:
      - "127.0.0.1:9178:9176"

  # Monitors openvpn-server itself (not a client): openvpn_server_* metrics,
  # one series per connected client (openvpn_26/openvpn_25/openvpn_27 above).
  exporter_server:
    build: ../../..
    depends_on:
      - openvpn-server
    environment:
      OPENVPN_EXPORTER_SERVER_NAME: vpn-server
      OPENVPN_EXPORTER_SERVER_MANAGEMENT_ADDRESS: openvpn-server:7504
      OPENVPN_EXPORTER_PASSWORD: ${SERVER_MGMT_PASSWORD}
      OPENVPN_EXPORTER_SCRAPE_TIMEOUT: 3s
    ports:
      - "127.0.0.1:9179:9176"

volumes:
  pki-server-data:
  pki-openvpn_26-data:
  pki-openvpn_25-data:
  pki-openvpn_27-data:
