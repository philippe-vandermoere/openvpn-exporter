name: Chart Release

on:
  push:
    tags:
      - "chart-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: helm lint charts/openvpn-exporter
      - run: helm package charts/openvpn-exporter --destination dist
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin
      - name: Push chart
        run: |
          helm push dist/openvpn-exporter-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
