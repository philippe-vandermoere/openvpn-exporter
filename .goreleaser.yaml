version: 2

builds:
  - id: openvpn-exporter
    main: ./cmd/openvpn-exporter
    binary: openvpn-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: openvpn-exporter
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
